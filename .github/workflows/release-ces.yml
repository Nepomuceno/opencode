name: release-ces
run-name: "release ${{ inputs.version || github.ref_name }}"

# CES fork release pipeline.
#
# Builds the opencode CLI for darwin/linux/windows and uploads the binaries
# as a GitHub Release on the CES fork. Intentionally does NOT publish to npm,
# Homebrew, AUR, Docker, or any other upstream channel.
#
# Triggers:
#   - manual dispatch (pick a version, e.g. "1.14.20-ces3")
#   - pushing a tag of the form v*-ces*  (e.g. v1.14.20-ces3)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. "1.14.20-ces3"). Empty = derive from package.json + -ces3 suffix.'
        required: false
        type: string
      draft:
        description: "Publish as draft"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*-ces*"

permissions:
  contents: write

concurrency:
  group: release-ces-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            # Derive from packages/opencode/package.json with the CES suffix the
            # build script will apply. We just need this for the release tag.
            upstream=$(node -p "require('./packages/opencode/package.json').version")
            version="${upstream}-ces3"
          fi
          case "$version" in
            *-ces*) ;;
            *) version="${version}-ces3" ;;
          esac
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version} (tag ${tag})"

      - name: Create draft release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes "CES build of opencode. See [upstream changelog](https://github.com/anomalyco/opencode/releases) for details."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target_os: darwin
            target_arch: arm64
          - host: macos-13
            target_os: darwin
            target_arch: x64
          - host: ubuntu-latest
            target_os: linux
            target_arch: x64
          - host: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
          - host: windows-latest
            target_os: win32
            target_arch: x64
          - host: windows-11-arm
            target_os: win32
            target_arch: arm64
    runs-on: ${{ matrix.host }}
    env:
      OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
      OPENCODE_RELEASE: "1"
      OPENCODE_CES_SUFFIX: "-ces3"
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Sanity check — no compromised TanStack artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find node_modules -name "router_init.js" -type f 2>/dev/null | grep .; then
            echo "::error::Found router_init.js — possible Mini Shai-Hulud compromise (TanStack #7383)" >&2
            exit 1
          fi
          if grep -r '"@tanstack/setup"' node_modules 2>/dev/null | grep .; then
            echo "::error::Found @tanstack/setup — possible Mini Shai-Hulud compromise (TanStack #7383)" >&2
            exit 1
          fi
          echo "OK: no compromised TanStack artifacts found."

      - name: Build CLI (single target)
        shell: bash
        run: bun run --cwd packages/opencode script/build.ts --single --skip-embed-web-ui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd packages/opencode/dist
          dir=$(ls -1d */ | head -n1)
          dir="${dir%/}"
          cd "$dir/bin"
          if [ "${{ matrix.target_os }}" = "linux" ]; then
            tar -czf "../../../${dir}.tar.gz" *
          elif [ "${{ matrix.target_os }}" = "win32" ]; then
            7z a "../../../${dir}.zip" * >/dev/null
          else
            zip -r "../../../${dir}.zip" * >/dev/null
          fi

      - name: Upload to release
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd packages/opencode/dist
          assets=$(ls -1 *.tar.gz *.zip 2>/dev/null || true)
          if [ -z "$assets" ]; then
            echo "::error::No artifacts produced" >&2
            exit 1
          fi
          echo "Uploading: $assets"
          gh release upload "$TAG" $assets --clobber

  finalize:
    needs:
      - prepare
      - build
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
